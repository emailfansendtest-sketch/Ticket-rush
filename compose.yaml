services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ticketrush
      POSTGRES_PASSWORD: localdevonly
      POSTGRES_DB: ticketrush
    ports:
      - "5439:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ticketrush -d ticketrush"]
      interval: 3s
      timeout: 2s
      retries: 15
    volumes:
      - ticket_pg:/var/lib/postgresql/data
      - ./deploy/postgres/001_schema.sql:/docker-entrypoint-initdb.d/001_schema.sql:ro
  api:
    build:
      context: .
      dockerfile: src/TicketRush.Api/Dockerfile
    environment:
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__BookingDb: Host=postgres;Port=5432;Database=ticketrush;Username=ticketrush;Password=localdevonly
    ports:
      - "8088:8080"
    depends_on:
      postgres:
        condition: service_healthy
volumes:
  ticket_pg:
