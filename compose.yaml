services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ticketrush
      POSTGRES_PASSWORD: localdevonly
      POSTGRES_DB: ticketrush
    ports:
      - "127.0.0.1:5439:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ticketrush -d ticketrush"]
      interval: 3s
      timeout: 2s
      retries: 15
    volumes:
      - ticket_pg:/var/lib/postgresql/data
  catalog-postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ticketrush
      POSTGRES_PASSWORD: localdevonly
      POSTGRES_DB: ticketrush_catalog
    ports:
      - "127.0.0.1:5440:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ticketrush -d ticketrush_catalog"]
      interval: 3s
      timeout: 2s
      retries: 15
    volumes:
      - ticket_catalog_pg:/var/lib/postgresql/data
  payment-postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ticketrush
      POSTGRES_PASSWORD: localdevonly
      POSTGRES_DB: ticketrush_payment
    ports:
      - "127.0.0.1:5442:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ticketrush -d ticketrush_payment"]
      interval: 3s
      timeout: 2s
      retries: 15
    volumes:
      - ticket_payment_pg:/var/lib/postgresql/data
  payment-migrate:
    build:
      context: .
      dockerfile: src/TicketRush.Payment.DbMigrator/Dockerfile
    environment:
      ConnectionStrings__PaymentDb: "Host=payment-postgres;Port=5432;Database=ticketrush_payment;Username=ticketrush;Password=localdevonly;GSS Encryption Mode=Disable"
    depends_on:
      payment-postgres:
        condition: service_healthy
    restart: "no"
  payment-worker:
    build:
      context: .
      dockerfile: src/TicketRush.Payment.Worker/Dockerfile
    environment:
      ConnectionStrings__PaymentDb: "Host=payment-postgres;Port=5432;Database=ticketrush_payment;Username=ticketrush;Password=localdevonly;GSS Encryption Mode=Disable"
      RabbitMq__Uri: "amqp://ticketrush:localdevonly@rabbitmq:5672/"
    depends_on:
      payment-migrate:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped
  ordering-postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ticketrush
      POSTGRES_PASSWORD: localdevonly
      POSTGRES_DB: ticketrush_ordering
    ports:
      - "127.0.0.1:5441:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ticketrush -d ticketrush_ordering"]
      interval: 3s
      timeout: 2s
      retries: 15
    volumes:
      - ticket_ordering_pg:/var/lib/postgresql/data
  ordering-migrate:
    build:
      context: .
      dockerfile: src/TicketRush.Ordering.DbMigrator/Dockerfile
    environment:
      ConnectionStrings__OrderingDb: Host=ordering-postgres;Port=5432;Database=ticketrush_ordering;Username=ticketrush;Password=localdevonly;GSS Encryption Mode=Disable
    depends_on:
      ordering-postgres:
        condition: service_healthy
    restart: "no"
  rabbitmq:
    image: rabbitmq:4-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: ticketrush
      RABBITMQ_DEFAULT_PASS: localdevonly
    ports:
      - "127.0.0.1:15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - ticket_rabbitmq:/var/lib/rabbitmq
  keycloak:
    image: quay.io/keycloak/keycloak:26.8.1
    command: ["start-dev", "--import-realm", "--hostname=http://keycloak:8080"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: localadmin
      KC_BOOTSTRAP_ADMIN_PASSWORD: local-admin-dev-only
    ports:
      - "127.0.0.1:8092:8080"
    volumes:
      - ./deploy/keycloak/ticketrush-realm.json:/opt/keycloak/data/import/ticketrush-realm.json:ro
    restart: unless-stopped
  ordering-api:
    build:
      context: .
      dockerfile: src/TicketRush.Ordering.Api/Dockerfile
    environment:
      ASPNETCORE_URLS: http://+:8080
      ASPNETCORE_ENVIRONMENT: Development
      Auth__Authority: http://keycloak:8080/realms/ticketrush
      Auth__Audience: ticketrush-apis
      PaymentSandbox__AllowTestDeclines: "true"
      Auth__AllowInsecureHttpMetadata: "true"
      HoldProof__KeyBase64: "${HOLD_PROOF_KEY_BASE64:?Run scripts/Initialize-Dev-Hold-Proof.ps1 first}"
      ConnectionStrings__OrderingDb: "Host=ordering-postgres;Port=5432;Database=ticketrush_ordering;Username=ticketrush;Password=localdevonly;GSS Encryption Mode=Disable"
    ports:
      - "127.0.0.1:8091:8080"
    depends_on:
      keycloak:
        condition: service_started
      ordering-migrate:
        condition: service_completed_successfully
    restart: unless-stopped
  ordering-outbox:
    build:
      context: .
      dockerfile: src/TicketRush.Ordering.OutboxPublisher/Dockerfile
    environment:
      ConnectionStrings__OrderingDb: "Host=ordering-postgres;Port=5432;Database=ticketrush_ordering;Username=ticketrush;Password=localdevonly;GSS Encryption Mode=Disable"
      RabbitMq__Uri: "amqp://ticketrush:localdevonly@rabbitmq:5672/"
    depends_on:
      ordering-migrate:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped
  ordering-saga:
    build:
      context: .
      dockerfile: src/TicketRush.Ordering.SagaWorker/Dockerfile
    environment:
      ConnectionStrings__OrderingDb: "Host=ordering-postgres;Port=5432;Database=ticketrush_ordering;Username=ticketrush;Password=localdevonly;GSS Encryption Mode=Disable"
      RabbitMq__Uri: "amqp://ticketrush:localdevonly@rabbitmq:5672/"
    depends_on:
      ordering-migrate:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped
  catalog-migrate:
    build:
      context: .
      dockerfile: src/TicketRush.Catalog.DbMigrator/Dockerfile
    environment:
      ConnectionStrings__CatalogDb: Host=catalog-postgres;Port=5432;Database=ticketrush_catalog;Username=ticketrush;Password=localdevonly;GSS Encryption Mode=Disable
      SEED_DEMO_DATA: "true"
    depends_on:
      catalog-postgres:
        condition: service_healthy
    restart: "no"
  catalog-api:
    build:
      context: .
      dockerfile: src/TicketRush.Catalog.Api/Dockerfile
    environment:
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__CatalogDb: Host=catalog-postgres;Port=5432;Database=ticketrush_catalog;Username=ticketrush;Password=localdevonly;GSS Encryption Mode=Disable
    ports:
      - "127.0.0.1:8090:8080"
    depends_on:
      catalog-migrate:
        condition: service_completed_successfully
  migrate:
    build:
      context: .
      dockerfile: src/TicketRush.DbMigrator/Dockerfile
    environment:
      ConnectionStrings__BookingDb: Host=postgres;Port=5432;Database=ticketrush;Username=ticketrush;Password=localdevonly;GSS Encryption Mode=Disable
      SEED_DEMO_DATA: "true"
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"
  inventory-consumer:
    build:
      context: .
      dockerfile: src/TicketRush.Inventory.MessageConsumer/Dockerfile
    environment:
      ConnectionStrings__BookingDb: "Host=postgres;Port=5432;Database=ticketrush;Username=ticketrush;Password=localdevonly;GSS Encryption Mode=Disable"
      RabbitMq__Uri: "amqp://ticketrush:localdevonly@rabbitmq:5672/"
    depends_on:
      migrate:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped
  inventory-result-outbox:
    build:
      context: .
      dockerfile: src/TicketRush.Inventory.ResultPublisher/Dockerfile
    environment:
      ConnectionStrings__BookingDb: "Host=postgres;Port=5432;Database=ticketrush;Username=ticketrush;Password=localdevonly;GSS Encryption Mode=Disable"
      RabbitMq__Uri: "amqp://ticketrush:localdevonly@rabbitmq:5672/"
    depends_on:
      migrate:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped
  api:
    build:
      context: .
      dockerfile: src/TicketRush.Api/Dockerfile
    environment:
      ASPNETCORE_URLS: http://+:8080
      ASPNETCORE_ENVIRONMENT: Development
      Auth__Authority: http://keycloak:8080/realms/ticketrush
      Auth__Audience: ticketrush-apis
      Auth__AllowInsecureHttpMetadata: "true"
      HoldProof__KeyBase64: "${HOLD_PROOF_KEY_BASE64:?Run scripts/Initialize-Dev-Hold-Proof.ps1 first}"
      ConnectionStrings__BookingDb: Host=postgres;Port=5432;Database=ticketrush;Username=ticketrush;Password=localdevonly;GSS Encryption Mode=Disable
      Catalog__BaseUrl: http://catalog-api:8080/
    ports:
      - "127.0.0.1:8088:8080"
    depends_on:
      keycloak:
        condition: service_started
      migrate:
        condition: service_completed_successfully
      catalog-api:
        condition: service_started
volumes:
  ticket_pg:
  ticket_catalog_pg:
  ticket_ordering_pg:
  ticket_payment_pg:
  ticket_rabbitmq:
